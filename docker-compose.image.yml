services:
  trae-cn-relay:
    image: "${GHCR_IMAGE:-ghcr.io/luyongwen/trae2api-cn}:${IMAGE_TAG:-latest}"
    container_name: trae-cn-relay
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    ports:
      - "${RELAY_PORT:-8000}:${PORT:-8000}"
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
