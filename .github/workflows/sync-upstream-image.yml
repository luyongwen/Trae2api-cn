name: Sync upstream container image

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream branch, tag, or commit to build"
        required: false
        default: "main"
        type: string

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REPOSITORY: autumnsentiment/Trae2api-cn
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/trae2api-cn

concurrency:
  group: sync-upstream-image
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push upstream image
    runs-on: ubuntu-latest
    steps:
      - name: Check out upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ inputs.upstream_ref || 'main' }}
          fetch-depth: 1

      - name: Resolve upstream revision
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=upstream-${{ steps.revision.outputs.sha }}
            type=raw,value=sync-${{ github.run_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPOSITORY }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELAY_BUILD_REVISION=${{ steps.revision.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max